<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YKS Birebir Takip — Ders, İstek ve Öğrenci Eksik Otomasyonu</title>
<meta name="description" content="YKS Kurs/Etüt merkezleri için birebir ders, istek havuzu ve öğrenci eksik takip otomasyonu. Tüm veriler bu bilgisayarda saklanır." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314b8a6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'>Y</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="tasiyev">
  <nav class="başlık">
    <div class="orta">
      <div class="loket"><i class="fa-solid fa-graduation-cap"></i></div>
      <div>
        <div class="baslik"><input id="dönemSec" list="dönemList" class="dönem" onchange="dönemDegistir(this.value)" />
          <datalist id="dönemList"><option value="2026/2027"></option></datalist>
        </div>
        <div class="alt"><span id="solup"></span></div>
      </div>
      <div class="sey" id="sey">
        <div class="sepker"><button onclick="yedekAl2()" title="Verileri json olarak kaydet" class="sek"><i class="fa-solid fa-download"></i></button><span>Yedekle</span></div>
        <div class="sepker"><button onclick="yedekYukle2()" title="json yedekten yükle" class="sek"><i class="fa-solid fa-upload"></i></button><span>Yükle</span></div>
        <div class="sepker"><button onclick="setAyYaz()" title="Ay bilgisi" class="sek" id="aySec"><i class="fa-solid fa-calendar"></i></button><span>Ay Yaz</span></div>
        <div class="sepker"><button onclick="indirApp2()" title="index.html" class="sek"><i class="fa-solid fa-file-code"></i></button><span>İndir</span></div>
      </div>
    </div>
  </nav>
  <main class="giyim">
    <div class="sekciler">
      <button id="b-itiraz" onclick="bolge('itiraz')" class="sek learner sec"><i class="fa-solid fa-list flex"></i><h6>ÖĞRENİM & İSTEK HAVUZU</h6></button>
      <button id="b-planla" onclick="bolge('planla')" class="sek learner sec"><i class="fa-solid fa-chalkboard-user flex"></i><h6>DERS ÖĞRETMEN SEÇİMİ</h6></button>
      <button id="b-kayit" onclick="bolge('kayit')" class="sek learner sec"><i class="fa-solid fa-clock-three flex"></i><h6>DERS KAYIT VE ANALİZ</h6></button>
      <button id="b-ayar" onclick="bolge('ayar')" class="sek learner sec"><i class="fa-solid fa-gear flex"></i><h6>AYAR & YEDEK</h6></button>
    </div>
    <hr />
    <div class="kutu">
      <div class="bolge hidden" id="bolge-itiraz">
        <div class="ana2">
          <h6>İstek Havuzu</h6>
          <div id="istk-havuz"></div>
        </div>
        <div class="ana2">
          <h6>Sınıf Ek Ders: Öğretmen Atama</h6>
          <div class="bölgesi-sarkit">
            <div class="tabloyu-anne">
              <div class="tablo-dikey">
                <h4 class="baslik-bas">Sınıf ek ders ayarları</h4>
                <div id="sinif-ek-ders-form"></div>
                <p class="acik" id="sinif-ek-ders-aciklama"></p>
                <div id="sinif-ek-ders-secim"></div>
              </div>
              <div class="tablo-dikey">
                <h4 class="baslik-bas">Öğretmen Takvimi</h4>
                <div class="grid" id="ogretmen-takvimi"></div>
              </div>
            </div>
          </div>
          <button class="flex btn-teal" onclick="ekDersPlanla()"><i class="fa-solid fa-pen-to-square"></i> Ders Atama</button>
        </div>
        <div class="ana2">
          <h6>Haftalık Program</h6>
          <div class="kart" id="haftalik-program"></div>
        </div>
        <div class="ana2">
          <h6>Ders Listesi</h6>
          <div class="kart" id="ders-listesi"></div>
        </div>
      </div>
      <div class="bolge hidden" id="bolge-planla">
        <div class="ana2">
          <h6>Birebir Ders Planlama Formu</h6>
          <form id="planlama-form" class="planlama-form">
            <div class="form-grup">
              <label for="f-ogrenci">Öğrenci</label>
              <input id="f-ogrenci" list="dl-ogrenci" placeholder="Ad Soyad" autocomplete="off" />
              <datalist id="dl-ogrenci"></datalist>
            </div>
            <div class="form-grup">
              <label for="f-ders">Ders</label>
              <select id="f-ders">
                <option value="Fizik">Fizik</option>
                <option value="Kimya">Kimya</option>
                <option value="Matematik">Matematik</option>
                <option value="Türkçe">Türkçe</option>
                <option value="Edebiyat">Edebiyat</option>
                <option value="Ingilizce">İngilizce</option>
                <option value="Geometri">Geometri</option>
              </select>
            </div>
            <div class="form-grup">
              <label for="f-konu">Eksik Konu</label>
              <input id="f-konu" placeholder="Konu" autocomplete="off" />
            </div>
            <div class="form-grup">
              <label for="f-ogretmen">Öğretmen</label>
              <input id="f-ogretmen" list="dl-ogretmen" placeholder="Öğretmen Adı" autocomplete="off" />
              <datalist id="dl-ogretmen"></datalist>
            </div>
            <div class="form-grup">
              <label for="f-tarih">Tarih</label>
              <input type="date" id="f-tarih" />
            </div>
            <div class="form-grup">
              <label for="f-saat">Saat</label>
              <select id="f-saat">
                <option value="08:50">08:50 - 09:30</option>
                <option value="09:40">09:40 - 10:20</option>
                <option value="10:30">10:30 - 11:10</option>
                <option value="11:20">11:20 - 12:00</option>
                <option value="13:00">13:00 - 13:40</option>
                <option value="13:50">13:50 - 14:30</option>
                <option value="14:40">14:40 - 15:20</option>
                <option value="15:30">15:30 - 16:10</option>
                <option value="16:20">16:20 - 17:00</option>
                <option value="17:10">17:10 - 17:50</option>
                <option value="18:00">18:00 - 18:40</option>
              </select>
            </div>
            <div class="form-butonlar">
              <button type="submit" class="btn-teal">Ders Planla</button>
              <button type="button" onclick="silIstek()" class="btn-outline">İstek Sil</button>
            </div>
            <div id="planlama-uyari" class="uyari hidden"></div>
          </form>
        </div>
      </div>
      <div class="bolge hidden" id="bolge-kayit">
        <div class="ana2">
          <h6>Ders Kayıt Tablosu</h6>
          <div class="kart" id="ders-tablosu"></div>
        </div>
      </div>
      <div class="bolge hidden" id="bolge-ayar">
        <div class="ana2">
          <h6>Ayarlar</h6>
          <div class="kart" id="ayarlar-kart"></div>
        </div>
      </div>
    </div>
  </main>
  <div id="toast-kutu" class="toast-kutusu toast-gizli" aria-live="polite">
    <div class="toast" id="toast-icerik"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
